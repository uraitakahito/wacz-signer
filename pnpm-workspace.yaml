# pnpm 11 は依存の lifecycle script を既定で実行しない。走らせてよいものだけを
# 明示する。この 2 つは `pnpm install` に列挙させた実測値で、増やす前には
# 「なぜビルドが要るのか」を確かめること。
#
#   esbuild        — vitest 経由。platform 別の binary を postinstall で用意する
#   unrs-resolver  — eslint-plugin-import-x が使う Rust 実装の path resolver。
#                    native bindings の link が要る
#
# BrowserHive はここに puppeteer も並べているが、wacz-signer は Chromium を使わない
# ので無い。wacz-signer の実行時依存は openssl 1 つで、npm の依存はすべて
# devDependencies。
allowBuilds:
  esbuild: true
  unrs-resolver: true

# npm は pre<script> / post<script> を自動実行するが、pnpm は既定でしない。
# wacz-signer には現時点で pre/post script が 1 つも無いので、この設定は今日は
# 何も変えない。それでも書いてあるのは、これが移行だからで —— 将来 prebuild
# などを足したときに「npm では走っていたものが pnpm では黙って走らない」という
# 差分を持ち込まないため。capture-fixtures は実際に prebuild / pretypecheck / pretest /
# prelint を持っており、同じ形になったときに事故る。
enablePrePostScripts: true

# audit から外す勧告。外すのは、上流が修正版を受け取れず、override でも越えられないものだけ。
# 1 件ごとに、なぜ越えられないかと、外す条件を書く（capture-fixtures と同じ決まり）。
auditConfig:
  ignoreGhsas:
    # minimatch: globparts の増幅による DoS。修正は 11.0.1 からで、10 系には無い。11 は名前付きの
    # 書き出し makeRe をやめたので、override で 11 にすると eslint-plugin-import-x が読み込みで落ちる
    # (capture-fixtures で実測。lint が "does not provide an export named 'makeRe'" で止まる)。
    # eslint・@eslint/config-array・@typescript-eslint/typescript-estree・eslint-plugin-import-x の最新版が
    # どれも ^10 を要求する。wacz-signer の npm の依存はすべて devDependencies で、minimatch 10 が居るのは
    # lint の道具の中だけ。読むパターンは eslint の設定と lint の対象 (この repo の物) だけで、実行時の木には
    # 無い (`pnpm audit --prod` は 0)。
    # 外す条件: これらの親が ^11 を要求する版を出したとき (そのとき update で直る)。
    - GHSA-g3hv-75wg-m249
