name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, so its `cache: pnpm` has a pnpm to ask for the store
      # path. The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # wacz-signer does no cryptography of its own, so openssl decides every
      # result here. Its version is the one thing that can change the answers
      # without a commit, which makes it the first thing to check when a test
      # starts failing for no visible reason. Recorded before anything runs.
      - name: Record the openssl in use
        run: |
          openssl version -a
          command -v openssl

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Builds before testing rather than after: test/cli.test.ts spawns
      # dist/cli.js, which is what `bin` points at. Testing the source instead
      # would leave the shipped entry point unexercised.
      - name: Build
        run: pnpm run build

      - name: Tests
        run: pnpm test
